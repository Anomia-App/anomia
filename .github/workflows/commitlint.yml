
# This is a basic workflow to help you get started with Actions.
# See more here: https://docs.github.com/actions

# Name of workflow
name: commitlint

# Controls when the workflow will run
on:
  # Triggers the workflow on pull request events but only for the "develop" branch
  pull_request:
    branches: ['develop']
    types: ['opened', 'edited', 'synchronize', 'reopened']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can be run sequentially or in parallel
jobs:
  # This workflow contains a single job called "commitlint"
  commitlint:
    # The type of runner that the job will run on
    # This is a docker image of Ubuntu LTS
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as a part of the job
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          # Shallow clone
          fetch-depth: 0
      
      # Installs dependencies
      - name: Install commitlint
        run: |
          npm install conventional-changelog-conventionalcommits
          npm install commitlint@latest
          npm install @commitlint/format
          npm install commitlint-plugin-selective-scope

      # Runs commitlint against PR title
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint
