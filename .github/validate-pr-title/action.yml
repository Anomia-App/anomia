name: 'Validate PR Title'
description: 'Validate PR title to ensure conformity to guidelines'
inputs:
  pr-title:
    description: 'The PR title'
    required: true
runs:
  using: "composite"
  steps:
  - run: echo "${{ github.action_path }}" >> $GITHUB_PATH
    shell: bash
  - run: validate-pr-title.sh "${{ inputs.pr-title }}"
    shell: bash
